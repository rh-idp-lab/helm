apiVersion: batch/v1
kind: Job
metadata:
  name: initialize-gitlab
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: 100
  template:
    spec:
      containers:
      - name: initialize-gitlab
        command:
          - /bin/bash
          - '-c'
          - |
            set -x
            ansible-playbook -i localhost /scripts/playbook.yaml \
              -e "skip_initial_wait=${SKIP_INITIAL_WAIT:-false}"
        env:
          - name: SKIP_INITIAL_WAIT
            value: "{{ .Values.gitlab.skipInitialWait | default false | toString }}"
        image: quay.io/agnosticd/ee-multicloud:latest
        volumeMounts:
          - mountPath: /scripts
            name: init-gitlab-vol
      restartPolicy: Never
      serviceAccount: gitlab
      volumes:
      - name: init-gitlab-vol
        configMap:
          name: cm-init-gitlab