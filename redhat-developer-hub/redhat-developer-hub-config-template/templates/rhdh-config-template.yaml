kind: ConfigMap
metadata:
  name:  "rhdh-config-template-{{ $.Values.nameOverride }}"
  namespace: {{ .Values.namespace }}
  annotations:
    {{- include "argocd.syncwave" . | nindent 4 }}
apiVersion: v1
data:
  playbook.yaml: |
    ---
    - name: RHDH Config templates
      hosts: localhost
      tasks:
        - name: Check existence of group
          ansible.builtin.uri:
            url: https://root:{{ $.Values.gitlab.rootPassword }}@{{ $.Values.gitlab.host }}/api/v4/groups/{{ $.Values.rhdh.template.group }}
            method: GET
            validate_certs: false
          register: r_liveness
          retries: 120
          delay: 10
          until: r_liveness.status == 200

        - name: Git config
          ansible.builtin.command: git config --global user.email "{{ $.Values.gitlab.email.address }}"
          ignore_errors: true

        - name: Git config
          ansible.builtin.command: git config --global user.name "{{ $.Values.gitlab.email.displayName }}"
          ignore_errors: true

{{- range $item := .Values.rhdh.template.templates }}

        - name: Build git repo url
          ansible.builtin.set_fact:
            _git_template_repo_url: https://root:{{ $.Values.gitlab.rootPassword }}@{{ $.Values.gitlab.host }}/{{ $.Values.rhdh.template.group }}/{{ $item.project }}

        - name: Remove older repo folders
          shell: rm -rf /tmp/{{ $item.project }}

        - name: Check existence of git repo
          ansible.builtin.uri:
            url: '{{ "{{" }} _git_template_repo_url {{ "}}" }}'
            method: GET
            validate_certs: false
          register: r_liveness
          retries: 60
          delay: 10
          until: r_liveness.status == 200

        - name: Clone {{ $item.project }}
          ansible.builtin.git:
            accept_hostkey: true
            force: true
            repo: '{{ "{{" }} _git_template_repo_url {{ "}}" }}'
            dest: "/tmp/{{ $item.project }}"
            version: "{{ $item.branch }}"
          environment:
            GIT_SSL_NO_VERIFY: "true"
          register: r_git_clone
          retries: 60
          delay: 10
          until: r_git_clone is not failed

{{- range $item1 := $item.templates }}

        - name: Fetch /tmp/{{ $item.project }}/{{ $item1 }} template from remote host
          run_once: true
          ansible.builtin.fetch:
            src: /tmp/{{ $item.project }}/{{ $item1 }}
            dest: /tmp/{{ $item1 }}
            flat: true
            fail_on_missing: true

        - name: Check if {{ $item1 }} still has unresolved placeholders
          ansible.builtin.shell: >-
            grep -l 'cluster_subdomain' /tmp/{{ $item.project }}/{{ $item1 }} || true
          register: r_needs_update_{{ $item1 | replace "." "_" | replace "/" "_" | replace "-" "_" }}
          changed_when: false

        - name: Apply substitutions to /tmp/{{ $item.project }}/{{ $item1 }}
          ansible.builtin.shell: |
            python3 -c "
            import os, re
            ob = chr(123)*2
            cb = chr(125)*2
            def p(name): return ob + ' ' + name + ' ' + cb
            replacements = [
                (p('cluster_subdomain'),                       os.environ['V_CLUSTER_SUBDOMAIN']),
                (p('quay_host'),                               os.environ['V_QUAY_HOST']),
                (p('backstage_host'),                          os.environ['V_BACKSTAGE_HOST']),
                (p('gitlab_host'),                             os.environ['V_GITLAB_HOST']),
                (p('keycloak_host'),                           os.environ['V_KEYCLOAK_HOST']),
                (p('keycloak_realm'),                          os.environ['V_KEYCLOAK_REALM']),
                (p('keycloak_login_realm'),                    os.environ['V_KEYCLOAK_LOGIN_REALM']),
                (p('keycloak_client_id'),                      os.environ['V_KEYCLOAK_CLIENT_ID']),
                (p('keycloak_client_secret'),                  os.environ['V_KEYCLOAK_CLIENT_SECRET']),
                (p('argocd_host'),                             os.environ['V_ARGOCD_HOST']),
                (p('kubernetes_api_url'),                      os.environ['V_KUBERNETES_API_URL']),
                (p('backstage_backend_secret'),                os.environ['V_BACKEND_SECRET']),
                (p('oauth2_proxy_cookie_secret'),              os.environ['V_COOKIE_SECRET']),
                (p('oauth2_proxy_oidc_issuer'),                os.environ['V_OIDC_ISSUER']),
                (p('orchestrator_sonataflow_data_index_service'), os.environ['V_SONATAFLOW']),
                (p('postgresql_existingSecret'),               os.environ['V_PG_SECRET']),
            ]
            path = '/tmp/{{ $item.project }}/{{ $item1 }}'
            with open(path) as f:
                c = f.read()
            for k, v in replacements:
                c = c.replace(k, v)
            # Unescape Jinja2-escaped Helm expressions: {{ 'X' }} -> X
            c = re.sub(re.escape(ob) + r\" '(.+?)' \" + re.escape(cb), r'\1', c)
            with open(path, 'w') as f:
                f.write(c)
            "
          environment:
            V_CLUSTER_SUBDOMAIN:  "{{ $.Values.cluster.subdomain }}"
            V_QUAY_HOST:          "quay.{{ $.Values.cluster.subdomain }}"
            V_BACKSTAGE_HOST:     "{{ $.Values.backstage.host }}"
            V_GITLAB_HOST:        "{{ $.Values.gitlab.host }}"
            V_KEYCLOAK_HOST:      "{{ $.Values.keycloak.host }}"
            V_KEYCLOAK_REALM:     "{{ $.Values.keycloak.realm }}"
            V_KEYCLOAK_LOGIN_REALM: "{{ $.Values.keycloak.loginRealm }}"
            V_KEYCLOAK_CLIENT_ID: "{{ $.Values.keycloak.clientId }}"
            V_KEYCLOAK_CLIENT_SECRET: "{{ $.Values.keycloak.clientSecret }}"
            V_ARGOCD_HOST:        "{{ $.Values.gitops.host }}"
            V_KUBERNETES_API_URL: "{{ $.Values.kubernetes.api }}"
            V_BACKEND_SECRET:     "{{ randAlphaNum 24 | b64enc }}"
            V_COOKIE_SECRET:      "{{ randAlpha 32 | lower | b64enc }}"
            V_OIDC_ISSUER:        "{{ $.Values.oauth2.issuer }}"
            V_SONATAFLOW:         "{{ $.Values.orchestrator.sonataFlowDataIndexService }}"
            V_PG_SECRET:          "{{ $.Values.nameOverride }}-postgresql"
          when: r_needs_update_{{ $item1 | replace "." "_" | replace "/" "_" | replace "-" "_" }}.stdout != ""
{{- end }}

        - name: Add new files to the repository
          ansible.builtin.command:
            chdir: >-
              /tmp/{{ $item.project }}
            cmd: "git add ."
          ignore_errors: true

        - name: Commit changes to the repository (skip if nothing changed)
          ansible.builtin.shell:
            cmd: >-
              git diff --cached --quiet || git commit -m 'Updates for starting scenario.'
            chdir: /tmp/{{ $item.project }}
          ignore_errors: true

        - name: Push all changes back to the project repository
          ansible.builtin.command:
            chdir: >-
              /tmp/{{ $item.project }}
            cmd: >-
              git push {{ "{{" }} _git_template_repo_url {{ "}}" }}

{{- end }}