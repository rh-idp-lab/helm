apiVersion: v1
kind: ConfigMap
metadata:
  name: dynamic-plugins-rhdh
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  "dynamic-plugins.yaml": |
    includes:
      - dynamic-plugins.default.yaml
    plugins:

      # ── Kubernetes / OpenShift Topology ──────────────────────────────────────
      # Bundled in RHDH 1.10
      - package: ./dynamic-plugins/dist/backstage-plugin-kubernetes-backend-dynamic
        disabled: false
      - package: ./dynamic-plugins/dist/backstage-plugin-kubernetes
        disabled: false
      - package: ./dynamic-plugins/dist/backstage-community-plugin-topology
        disabled: false

      # ── OpenShift Pipelines (Tekton) ─────────────────────────────────────────
      # Moved to ghcr.io in RHDH 1.10 — uses {{inherit}} for version resolution
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-tekton:{{ "{{" }}inherit{{ "}}" }}'
        disabled: false

      # ── ArgoCD ───────────────────────────────────────────────────────────────
      # Both plugins moved to ghcr.io in RHDH 1.10
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/roadiehq-backstage-plugin-argo-cd-backend:{{ "{{" }}inherit{{ "}}" }}'
        disabled: false
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/roadiehq-scaffolder-backend-argocd:{{ "{{" }}inherit{{ "}}" }}'
        disabled: false

      # ── GitLab ───────────────────────────────────────────────────────────────
      # Catalog / org / scaffolder modules: bundled in RHDH 1.10
      - package: ./dynamic-plugins/dist/backstage-plugin-catalog-backend-module-gitlab-dynamic
        disabled: false
      - package: ./dynamic-plugins/dist/backstage-plugin-catalog-backend-module-gitlab-org-dynamic
        disabled: false
      - package: ./dynamic-plugins/dist/backstage-plugin-scaffolder-backend-module-gitlab-dynamic
        disabled: false
      # immobiliarelabs GitLab backend (MR/pipeline UI): on ghcr.io since RHDH 1.9
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/immobiliarelabs-backstage-plugin-gitlab-backend:{{ "{{" }}inherit{{ "}}" }}'
        disabled: false

      # ── Keycloak ─────────────────────────────────────────────────────────────
      # Bundled in RHDH 1.10
      - package: ./dynamic-plugins/dist/backstage-community-plugin-catalog-backend-module-keycloak-dynamic
        disabled: false

      # ── Quay ─────────────────────────────────────────────────────────────────
      # Both plugins moved to ghcr.io in RHDH 1.10
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-quay:{{ "{{" }}inherit{{ "}}" }}'
        disabled: false
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-quay-backend:{{ "{{" }}inherit{{ "}}" }}'
        disabled: false

      # ── RBAC ─────────────────────────────────────────────────────────────────
      # Bundled in RHDH 1.10
      - package: ./dynamic-plugins/dist/backstage-community-plugin-rbac
        disabled: false
