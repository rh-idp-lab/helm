apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-rhdh
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  "app-config.yaml": |
    app:
      title: Internal Developer Platform Lab
      baseUrl: https://{{ .Values.backstage.host }}

    backend:
      auth:
        externalAccess:
          - type: legacy
            options:
              subject: legacy-default-config
              secret: "${BACKEND_SECRET}"
          - type: static
            options:
              token: mYsecretToK3n
              subject: catalog-access
              accessRestrictions:
                - plugin: catalog
      baseUrl: https://{{ .Values.backstage.host }}
      cors:
        origin: https://{{ .Values.backstage.host }}

    integrations:
      gitlab:
        - host: {{ .Values.gitlab.host }}
          token: "${GITLAB_TOKEN}"
          apiBaseUrl: https://{{ .Values.gitlab.host }}/api/v4

    auth:
      environment: production
      session:
        secret: "${BACKEND_SECRET}"
      providers:
        oidc:
          production:
            clientId: "${OAUTH_CLIENT_ID}"
            clientSecret: "${OAUTH_CLIENT_SECRET}"
            metadataUrl: https://{{ .Values.keycloak.host }}/realms/{{ .Values.keycloak.realm }}/.well-known/openid-configuration
            prompt: auto
            additionalScopes: openid profile email
            signIn:
              resolvers:
                - resolver: preferredUsernameMatchingUserEntityName

    signInPage: oidc

    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - type: config
          clusters:
            - name: dev-cluster
              url: https://kubernetes.default.svc
              authProvider: serviceAccount
              serviceAccountToken: "${KUBERNETES_SA_TOKEN}"
              skipTLSVerify: true
      customResources:
        - group: 'route.openshift.io'
          apiVersion: 'v1'
          plural: 'routes'
        - group: 'tekton.dev'
          apiVersion: 'v1beta1'
          plural: 'pipelineruns'
        - group: 'tekton.dev'
          apiVersion: 'v1beta1'
          plural: 'taskruns'

    argocd:
      appLocatorMethods:
        - type: config
          instances:
            - name: rhdh-gitops
              url: https://{{ .Values.gitops.host }}
              username: admin
              password: "${ARGOCD_PASSWORD}"

    quay:
      uiUrl: https://quay.{{ .Values.cluster.subdomain }}

    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location, Template, User, Group, Domain]
      providers:
        keycloakOrg:
          default:
            baseUrl: https://{{ .Values.keycloak.host }}
            loginRealm: {{ .Values.keycloak.loginRealm | default .Values.keycloak.realm }}
            realm: {{ .Values.keycloak.realm }}
            clientId: "${OAUTH_CLIENT_ID}"
            clientSecret: "${OAUTH_CLIENT_SECRET}"
            schedule:
              frequency: { minutes: 30 }
              timeout: { minutes: 3 }
        gitlab:
          default:
            host: {{ .Values.gitlab.host }}
            branch: main
            fallbackBranch: master
            skipForkedRepos: true
            entityFilename: catalog-info.yaml
            projectPattern: \w*techdocs\w*
            schedule:
              frequency: { minutes: 2 }
              timeout: { minutes: 3 }
              initialDelay: { seconds: 15 }
          all-location-entity:
            host: {{ .Values.gitlab.host }}
            filters:
              branch: main
            skipForkedRepos: true
            entityFilename: all-location.yaml
            catalogPath: /**/all-location.yaml
            projectPattern: \b(all-location\w*)
            excludeRepos: []
            schedule:
              frequency: { seconds: 15 }
              initialDelay: { seconds: 15 }
              timeout: { minutes: 3 }
      locations:
        - type: url
          target: https://{{ .Values.gitlab.host }}/rhdh/opencodequest-templates/-/blob/main/entities.yaml
          rules:
            - allow: [Domain, System]

    permission:
      enabled: true
      rbac:
        policies-csv-file: /opt/app-root/src/rbac-policy.csv
        conditionalPoliciesFile: /opt/app-root/src/rbac-conditional-policies.yaml
        admin:
          superUsers:
            - name: "user:default/user1"
            - name: "user:default/user2"
            - name: "user:default/user3"
