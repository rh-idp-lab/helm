apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-rhdh
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  "app-config.yaml": |
    app:
      title: Red Hat Developer Hub
      baseUrl: https://{{ .Values.backstage.host }}

    backend:
      auth:
        externalAccess:
          - type: legacy
            options:
              subject: legacy-default-config
              secret: "${BACKEND_SECRET}"
      baseUrl: https://{{ .Values.backstage.host }}
      cors:
        origin: https://{{ .Values.backstage.host }}

    integrations:
      gitlab:
        - host: {{ .Values.gitlab.host }}
          token: "${GITLAB_TOKEN}"
          apiBaseUrl: https://{{ .Values.gitlab.host }}/api/v4

    auth:
      environment: production
      providers:
        oidc:
          production:
            clientId: "${OAUTH_CLIENT_ID}"
            clientSecret: "${OAUTH_CLIENT_SECRET}"
            metadataUrl: https://{{ .Values.keycloak.host }}/realms/{{ .Values.keycloak.realm }}/.well-known/openid-configuration
            prompt: auto
            scope: openid profile email
            signIn:
              resolvers:
                - resolver: emailMatchingUserEntityProfileEmail

    signInPage: oidc

    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - type: config
          clusters:
            - name: openshift
              url: https://kubernetes.default.svc
              authProvider: serviceAccount
              serviceAccountToken: "${KUBERNETES_SA_TOKEN}"
              skipTLSVerify: true

    argocd:
      appLocatorMethods:
        - type: config
          instances:
            - name: rhdh-gitops
              url: https://{{ .Values.gitops.host }}
              username: admin
              password: "${ARGOCD_PASSWORD}"

    quay:
      uiUrl: https://quay.{{ .Values.cluster.subdomain }}

    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location, Template, User, Group]
      locations:
        - type: url
          target: https://{{ .Values.gitlab.host }}/rhdh/developer-hub-config/-/blob/main/catalog-info.yaml
          rules:
            - allow: [User, Group, Template, Location]

    permission:
      enabled: true
      rbac:
        policies-csv-file: /opt/app-root/src/rbac-policy.csv
        conditionalPoliciesFile: /opt/app-root/src/rbac-conditional-policies.yaml
        admin:
          superUsers:
            - name: "user:default/user1"
            - name: "user:default/user2"
            - name: "user:default/user3"
